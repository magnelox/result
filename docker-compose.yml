version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://ssu_user:ssu_secure_password_2026@postgres:5432/ssu_results?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=ssu_super_secret_admin_jwt_key_2026_change_in_production
      - ADMIN_SESSION_NAME=ssu_admin_session
    volumes:
      - grade_card_storage:/app/storage/grade-cards
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: ssu_postgres
    environment:
      POSTGRES_USER: ssu_user
      POSTGRES_PASSWORD: ssu_secure_password_2026
      POSTGRES_DB: ssu_results
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ssu_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
  grade_card_storage:
